<VirtualHost *:80>
    ServerName gglearn.gglink.co.uk
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3400/
    ProxyPassReverse / http://127.0.0.1:3400/
    # Only Cloudflare (plus this machine) may reach the app. Plain `Include`, not IncludeOptional: if the file is
    # missing Apache refuses to load the config instead of silently serving the site to everyone.
    # certbot copies this vhost into the :443 one on the server; make sure that copy has the same Include line.
    Include /var/www/gglearn.gglink.co.uk/deploy/apache-cloudflare-only.conf
    ErrorLog ${APACHE_LOG_DIR}/gglearn-error.log
    CustomLog ${APACHE_LOG_DIR}/gglearn-access.log combined
</VirtualHost>
