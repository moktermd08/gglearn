<VirtualHost *:80>
    ServerName gglearn.gglink.co.uk
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3400/
    ProxyPassReverse / http://127.0.0.1:3400/
    ErrorLog ${APACHE_LOG_DIR}/gglearn-error.log
    CustomLog ${APACHE_LOG_DIR}/gglearn-access.log combined
</VirtualHost>
